services:
  - type: web
    name: clubhub-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: PYTHONPATH
        value: src
