services:
  - type: web
    name: clubhub-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m clubhub.main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
