[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clubhub"
version = "0.1.0"
description = "Configurable, open-source Discord bot and server management blueprint for clubs, student groups, and communities."
readme = "README.md"
authors = [
    { name = "ClubHub Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.3.2",
    "aiosqlite>=0.19.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
sheets = [
    "google-auth>=2.20.0",
    "google-api-python-client>=2.100.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
clubhub = "clubhub.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
